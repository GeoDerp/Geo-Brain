---
# ansible/deploy-stacks.yml
# Ansible playbook to securely and declaratively deploy STIG-Homelab stacks.
# Matches GEMINI.md mandate: "Declarative: All deployments and configurations must be strictly declarative."
# Replaces the imperative logic of deploy.sh.

- name: Deploy STIG-Homelab Stacks
  hosts: all
  become: no
  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    remote_base: "STIG-Homelab"
    # Base stacks in deployment order
    ordered_stacks:
      - step-ca
      - traefik
      - bunkerweb
      - pangolin
      - kanidm
      - oauth2-proxy
      - minio
      - loki
      - vector
      - prometheus
      - wazuh
      - falco
      - crowdsec
      - quay
      - defectdojo
      - gitea
      - ramalama
      - grafana
      - dockge
      - homepage
    # Optional developer / extra stacks
    optional_stacks:
      - pkg-sentinel

  tasks:
    - name: Discover user stacks
      local_action:
        module: find
        paths: "{{ repo_root }}/stacks/user"
        file_type: directory
      register: user_stacks_result

    - name: Set facts for user stacks
      set_fact:
        user_stacks: "{{ user_stacks_result.files | map(attribute='path') | map('basename') | map('regex_replace', '^(.*)$', 'user/\\1') | list }}"

    - name: Combine all stacks
      set_fact:
        all_stacks: "{{ ordered_stacks + user_stacks }}"

    - name: Filter by limit_stacks if provided
      set_fact:
        filtered_stacks: "{{ (ordered_stacks + optional_stacks + user_stacks) | intersect(limit_stacks.split(',')) if limit_stacks is defined else all_stacks }}"

    - name: Filter active stacks (must have docker-compose.yml with services)
      local_action:
        module: command
        cmd: "grep -q '^[[:space:]]*services:' {{ repo_root }}/stacks/{{ item }}/docker-compose.yml"
      register: active_stacks_check
      ignore_errors: true
      loop: "{{ filtered_stacks }}"

    - name: Set final target stacks
      set_fact:
        target_stacks: "{{ active_stacks_check.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

    - name: Generate Traefik dynamic configs locally using deploy.sh
      local_action:
        module: command
        cmd: "{{ repo_root }}/deploy.sh {{ item }} traefik_gen"
      loop: "{{ target_stacks }}"
      changed_when: false

    - name: Ensure target base directories exist on remote
      file:
        path: "~/{{ remote_base }}/stacks/{{ item }}"
        state: directory
      loop: "{{ target_stacks }}"

    - name: Synchronize stack directories (excluding data and logs)
      synchronize:
        src: "{{ repo_root }}/stacks/{{ item }}/"
        dest: "~/{{ remote_base }}/stacks/{{ item }}/"
        owner: no
        group: no
        rsync_opts:
          - "--exclude=data/"
          - "--exclude=models/"
          - "--exclude=*.log"
      loop: "{{ target_stacks }}"

    - name: Synchronize Traefik dynamic configs
      synchronize:
        src: "{{ repo_root }}/stacks/traefik/config/dynamic/"
        dest: "~/{{ remote_base }}/stacks/traefik/config/dynamic/"
        owner: no
        group: no
      ignore_errors: true

    - name: Copy root .env file
      copy:
        src: "{{ repo_root }}/.env"
        dest: "~/{{ remote_base }}/.env"
        mode: '0600'

    - name: Render config templates using envsubst
      shell: |
        ENVFILE="$HOME/{{ remote_base }}/.env"
        STACKDIR="$HOME/{{ remote_base }}/stacks/{{ item }}"
        [ -d "$STACKDIR" ] || exit 0
        set -a; [ -f "$ENVFILE" ] && source "$ENVFILE"; set +a
        command -v envsubst &>/dev/null || exit 0
        # Build a list of all exported variables for substitution
        VARS=$(env | grep -E '^(DOMAIN|DATA_DIR|KANIDM|OAUTH2|MINIO|QUAY|CLAIR|DEFECTDOJO|WAZUH|DOJO|GITEA|MOODLE|N8N|CROWDSEC|PUID|PGID)' | cut -d= -f1 | sed 's/^/$/' | tr '\n' ',' | sed 's/,$//')
        find "$STACKDIR" -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.toml' -o -name '*.conf' \) 2>/dev/null | while IFS= read -r f; do
            envsubst "$VARS" < "$f" > "$f.rendered" && mv "$f.rendered" "$f"
        done
      args:
        executable: /bin/bash
      loop: "{{ target_stacks | union(['traefik']) }}"
      changed_when: false

    - name: Ensure compose volume directories exist on remote
      shell: |
        set -a; [ -f "$HOME/{{ remote_base }}/.env" ] && source "$HOME/{{ remote_base }}/.env"; set +a
        DATA_DIR="${DATA_DIR:-/var/STIG-Homelab}"
        DATA_DIR="${DATA_DIR/#\~/$HOME}"
        COMPOSE_FILE="$HOME/{{ remote_base }}/stacks/{{ item }}/docker-compose.yml"
        
        [ ! -f "$COMPOSE_FILE" ] && exit 0
        
        grep -oP '^\s+-\s+\K\.\.?/[^:]+' "$COMPOSE_FILE" | while IFS= read -r p; do
            if [[ "$p" == ../* ]]; then
                mkdir -p "$HOME/{{ remote_base }}/stacks/$(dirname "$p")" 2>/dev/null || true
            else
                mkdir -p "$HOME/{{ remote_base }}/stacks/{{ item }}/${p#./}" 2>/dev/null || true
            fi
        done || true
        
        grep -oP '^\s+-\s+\K\$\{DATA_DIR[^}]*\}/[^:]+' "$COMPOSE_FILE" | while IFS= read -r p; do
            EXPANDED="${p/\$\{DATA_DIR\}/$DATA_DIR}"
            EXPANDED="${EXPANDED/\$\{DATA_DIR:-*\}/$DATA_DIR}"
            mkdir -p "$EXPANDED" 2>/dev/null || true
        done || true
      args:
        executable: /bin/bash
      loop: "{{ target_stacks }}"
      changed_when: false

    - name: Synchronize certificates
      synchronize:
        src: "{{ repo_root }}/certs/"
        dest: "~/{{ remote_base }}/certs/"
        owner: no
        group: no
      ignore_errors: true

    - name: Synchronize scripts
      synchronize:
        src: "{{ repo_root }}/scripts/"
        dest: "~/{{ remote_base }}/scripts/"
        owner: no
        group: no
      ignore_errors: true

    - name: Ensure pre-requisite podman networks exist
      shell: |
        if [ "{{ item }}" = "secure-backbone" ] || [ "{{ item }}" = "quay-net" ] || [ "{{ item }}" = "moodle-db-net" ]; then
          podman network exists {{ item }} || podman network create --internal --label security.stig.compliance=true {{ item }}
        else
          podman network exists {{ item }} || podman network create --label security.stig.compliance=true {{ item }}
        fi
      register: network_create
      changed_when: "network_create.stdout | trim != ''"
      loop:
        - proxy-net
        - identity-net
        - monitoring-net
        - security-net
        - wazuh-net
        - storage-net
        - quay-net
        - vulnerability-net
        - mgmt-net
        - pki-net
        - waf-net
        - secure-backbone

    - name: Pre-flight delay for Quay
      pause:
        seconds: 30
      when: "'quay' in target_stacks"

    - name: Deploy stacks using Podman Compose
      shell: |
        set -a; [ -f "$HOME/{{ remote_base }}/.env" ] && source "$HOME/{{ remote_base }}/.env"; set +a
        podman-compose up -d --build --remove-orphans
      args:
        chdir: "~/{{ remote_base }}/stacks/{{ item }}"
        executable: /bin/bash
      environment:
        CONTAINER_UID: "{{ ansible_facts.user_uid }}"
        PODMAN_SOCK: "/run/user/{{ ansible_facts.user_uid }}/podman/podman.sock"
        STACKS_PATH: "{{ ansible_env.HOME }}/{{ remote_base }}/stacks"
      loop: "{{ target_stacks }}"
      register: compose_output
      changed_when: "'Created' in compose_output.stdout or 'Recreated' in compose_output.stdout"

    - name: Check if Kanidm is running
      shell: podman container inspect kanidm --format '{{ "{{" }}.State.Running{{ "}}" }}' 2>/dev/null | grep -q true
      register: kanidm_check
      ignore_errors: true
      changed_when: false

    - name: Wait for Kanidm to be healthy
      command: podman healthcheck run kanidm
      register: kanidm_health
      until: kanidm_health.rc == 0
      retries: 30
      delay: 5
      when: kanidm_check.rc == 0
      changed_when: false

    - name: Automate Kanidm OIDC Clients and generate secrets
      shell: "~/{{ remote_base }}/scripts/setup/setup-oidc.sh"
      register: oidc_automation
      changed_when: "'UPDATED_ENV' in oidc_automation.stdout"
      when: kanidm_check.rc == 0

    - name: Fetch updated .env back to local machine
      fetch:
        src: "~/{{ remote_base }}/.env"
        dest: "{{ repo_root }}/.env"
        flat: yes
      when: oidc_automation.changed

    - name: Redeploy stacks to pick up new OIDC secrets
      shell: |
        set -a; [ -f "$HOME/{{ remote_base }}/.env" ] && source "$HOME/{{ remote_base }}/.env"; set +a
        podman-compose up -d --build --remove-orphans
      args:
        chdir: "~/{{ remote_base }}/stacks/{{ item }}"
        executable: /bin/bash
      environment:
        CONTAINER_UID: "{{ ansible_facts.user_uid }}"
        PODMAN_SOCK: "/run/user/{{ ansible_facts.user_uid }}/podman/podman.sock"
        STACKS_PATH: "{{ ansible_env.HOME }}/{{ remote_base }}/stacks"
      loop: "{{ target_stacks }}"
      when: oidc_automation.changed
      register: compose_redeploy
      changed_when: "'Created' in compose_redeploy.stdout or 'Recreated' in compose_redeploy.stdout"
