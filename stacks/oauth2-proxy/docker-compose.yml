services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Kanidm
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://kanidm.${DOMAIN}/oauth2/openid/oauth2-proxy
      - OAUTH2_PROXY_CLIENT_ID=oauth2-proxy
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=${DOMAIN}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_main
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=email
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=groups
      - OAUTH2_PROXY_SCOPE=openid profile email groups
      - OAUTH2_PROXY_ALLOWED_GROUPS=brain_admins@${DOMAIN},brain_users@${DOMAIN}
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.${DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${DOMAIN}
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=false
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_PROVIDER_CA_FILES=/etc/ssl/certs/ca-bundle.crt
      - OAUTH2_PROXY_COOKIE_EXPIRE=1h
      - OAUTH2_PROXY_COOKIE_REFRESH=30m
    volumes:
      - ../traefik/config/certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro,z
    networks:
      - identity-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.routers.oauth2-proxy.tls.certresolver=stepca"
      - "traefik.http.routers.oauth2-proxy.middlewares=security-headers@file"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      - "kanidm.oidc.client_id=oauth2-proxy"
      - "security.stig.compliance=true"
      - "security.stig.role=auth-proxy"
      - "homepage.group=Identity"
      - "homepage.name=OAuth2 Proxy"
      - "homepage.icon=oauth.png"
      - "homepage.description=SSO Auth Portal"

  oauth2-proxy-admin:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy-admin
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Kanidm
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://kanidm.${DOMAIN}/oauth2/openid/oauth2-proxy
      - OAUTH2_PROXY_CLIENT_ID=oauth2-proxy
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=${DOMAIN}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_admin
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=email
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=groups
      - OAUTH2_PROXY_SCOPE=openid profile email groups
      - OAUTH2_PROXY_ALLOWED_GROUPS=brain_admins@${DOMAIN}
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.${DOMAIN}/admin-oauth2/callback
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${DOMAIN}
      - OAUTH2_PROXY_PROXY_PREFIX=/admin-oauth2
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=false
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_PROVIDER_CA_FILES=/etc/ssl/certs/ca-bundle.crt
      - OAUTH2_PROXY_COOKIE_EXPIRE=1h
      - OAUTH2_PROXY_COOKIE_REFRESH=30m
    volumes:
      - ../traefik/config/certs/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro,z
    networks:
      - identity-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=auth-proxy"

networks:
  identity-net:
    external: true
  proxy-net:
    external: true
