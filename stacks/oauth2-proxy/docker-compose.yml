services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --provider=oidc
      - --provider-display-name=Kanidm
      - --oidc-issuer-url=https://kanidm.${DOMAIN}/oauth2/openid/oauth2-proxy
      - --client-id=oauth2-proxy
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-domain=.${DOMAIN}
      - --email-domain=*
      - --oidc-email-claim=preferred_username
      - --scope=openid profile email
      - --redirect-url=https://auth.${DOMAIN}/oauth2/callback
      - --whitelist-domain=.${DOMAIN}
      - --set-xauthrequest=true
      - --set-authorization-header=true
      - --pass-authorization-header=true
      - --skip-provider-button=true
      - --upstream=static://202
      - --ssl-insecure-skip-verify=true
      - --cookie-expire=1h
      - --cookie-refresh=30m
    networks:
      - identity-net
      - proxy-net
    ports:
      - "4180:4180"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.routers.oauth2-proxy.tls.certresolver=stepca"
      - "traefik.http.routers.oauth2-proxy.middlewares=security-headers@file"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      - "kanidm.oidc.client_id=oauth2-proxy"
      - "security.stig.compliance=true"
      - "security.stig.role=auth-proxy"
      - "homepage.group=Identity"
      - "homepage.name=OAuth2 Proxy"
      - "homepage.icon=oauth.png"
      - "homepage.description=SSO Auth Portal"
      - "homepage.href=https://auth.${DOMAIN}"

networks:
  identity-net:
    external: true
  proxy-net:
    external: true
