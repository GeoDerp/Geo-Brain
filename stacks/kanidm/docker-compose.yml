services:
  kanidm:
    image: docker.io/kanidm/server:1.10.2
    container_name: kanidm
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    userns_mode: keep-id
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8443:8443"
    volumes:
      - ${DATA_DIR}/kanidm:/data:Z,U
      - ../../certs/kanidm-chain.crt:/data/chain.pem:ro,Z
      - ../../certs/kanidm.key:/data/key.pem:ro,Z
      - ./config/server.toml:/data/server.toml:z,U
    networks:
      - identity-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "/sbin/kanidmd", "version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanidm.rule=Host(`kanidm.${DOMAIN}`)"
      - "traefik.http.routers.kanidm.priority=2000"
      - "traefik.http.routers.kanidm.entrypoints=websecure"
      - "traefik.http.routers.kanidm.tls=true"
      - "traefik.http.routers.kanidm.middlewares=security-headers@file"
      - "traefik.http.services.kanidm.loadbalancer.server.port=8443"
      - "traefik.http.services.kanidm.loadbalancer.server.scheme=https"
      - "traefik.http.services.kanidm.loadbalancer.serverstransport=insecure-skip-verify@file"
      - "security.stig.compliance=true"
      - "security.stig.role=identity-provider"
      - "homepage.group=Identity"
      - "homepage.name=Kanidm"
      - "homepage.icon=kanidm.png"
      - "homepage.description=IDM Server"
      - "homepage.href=https://kanidm.${DOMAIN}"

networks:
  identity-net:
    external: true
  proxy-net:
    external: true
