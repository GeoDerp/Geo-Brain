services:
  kanidm:
    image: kanidm/server:1.9.1
    container_name: kanidm
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./data/kanidm:/data:Z
    networks:
      - identity-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=identity"
      - "homepage.group=Security"
      - "homepage.name=Kanidm"
      - "homepage.icon=kanidm.png"
      - "homepage.description=Identity Management"
      - "homepage.href=https://${DOMAIN}:8443"

networks:
  identity-net:
    driver: bridge
