services:
  authelia:
    image: docker.io/authelia/authelia:4.38.19
    container_name: authelia
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    volumes:
      - ./config:/config:z
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=expand-env
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_ENCRYPTION_KEY}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_BIND_PASSWORD=${AUTHELIA_LDAP_PASSWORD}
      - DOMAIN=${DOMAIN}
    networks:
      - identity-net
      - proxy-net
    ports:
      - "9091:9091"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/api/health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.middlewares=security-headers@file"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "security.stig.compliance=true"
      - "security.stig.role=auth-proxy"
      - "homepage.group=Identity"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.description=Auth & Portal"
      - "homepage.href=https://auth.${DOMAIN}"

networks:
  identity-net:
    external: true
  proxy-net:
    external: true
