# Authelia Configuration
# Ref: https://www.authelia.com/configuration/

theme: dark

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info
  format: json

totp:
  issuer: "geo-brain"
  period: 30
  skew: 1

authentication_backend:
  # Use Kanidm as LDAP backend
  ldap:
    address: "ldaps://kanidm:3636"
    implementation: custom
    tls:
      skip_verify: true
    start_tls: false
    base_dn: "${LDAP_BASE_DN}"
    users_filter: "(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))"
    groups_filter: "(member={dn})"
    attributes:
      username: "uid"
      display_name: "displayName"
      mail: "mail"
      group_name: "cn"
    user: "dn=token"
    password: "${LDAP_BIND_PASSWORD}"

# access_control rules are auto-generated by deploy.sh into access_rules.yml
# from authelia.access_control.policy labels in each stack's docker-compose.yml

session:
  name: authelia_session
  same_site: lax
  inactivity: 5m
  expiration: 1h
  remember_me: 1M
  cookies:
    - domain: "${DOMAIN}"
      authelia_url: "https://auth.${DOMAIN}"

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
