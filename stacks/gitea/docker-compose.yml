services:
  gitea:
    image: docker.io/gitea/gitea:1.21.11
    container_name: gitea
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DOMAIN=gitea.${DOMAIN}
      - GITEA__server__ROOT_URL=https://gitea.${DOMAIN}/
      - GITEA__server__SSH_DOMAIN=gitea.${DOMAIN}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__oauth2__ENABLED=true
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__service.oauth2__PROVIDER=openidConnect
      - GITEA__service.oauth2__NAME=Kanidm
      - GITEA__service.oauth2__CLIENT_ID=gitea
      - GITEA__service.oauth2__CLIENT_SECRET=${GITEA_OIDC_SECRET}
      - GITEA__service.oauth2__AUTO_DISCOVER_URL=https://kanidm.${DOMAIN}/oauth2/openid/gitea/.well-known/openid-configuration
    networks:
      - proxy-net
      - vulnerability-net
    volumes:
      - ${DATA_DIR}/gitea/data:/data:Z,U
      - ${STACKS_PATH}/../certs/ca.crt:/usr/local/share/ca-certificates/step-ca.crt:ro,z
    entrypoint: ["/bin/sh", "-c", "cat /usr/local/share/ca-certificates/step-ca.crt >> /etc/ssl/certs/ca-certificates.crt && exec /bin/s6-svscan /etc/s6"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "kanidm.oidc.client_id=gitea"
      - "security.stig.compliance=true"
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.routers.gitea.tls.certresolver=stepca"
      - "traefik.http.routers.gitea.middlewares=security-headers@file"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "homepage.group=Services"
      - "homepage.name=Gitea"
      - "homepage.icon=gitea.png"
      - "homepage.description=Git Mirror Server"
      - "homepage.href=https://gitea.${DOMAIN}"

  # Ephemeral sandboxed runner for standard CI/CD
  # NOTE: Podman socket mount is a container-escape vector; future work should
  # migrate to gVisor/Kata sandboxing per GEMINI.md mandate.
  gitea-runner:
    image: docker.io/gitea/act_runner:0.2.11
    container_name: gitea-runner
    restart: always
    depends_on:
      - gitea
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=ephemeral-sandbox-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:18-bullseye,ubuntu-22.04:docker://node:18-bullseye
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - proxy-net
    volumes:
      - ${DATA_DIR}/gitea-runner/data:/data:Z,U
      - ${PODMAN_SOCK}:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "act_runner", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - "security.stig.compliance=true"

  # Routine runner specifically for scheduled scanning of all mirrors
  gitea-routine-runner:
    image: docker.io/gitea/act_runner:0.2.11
    container_name: gitea-routine-runner
    restart: always
    depends_on:
      - gitea
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=routine-scan-runner
      - GITEA_RUNNER_LABELS=scan:docker://docker.io/aquasec/trivy:0.58.2
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - proxy-net
    volumes:
      - ${DATA_DIR}/gitea-routine-runner/data:/data:Z,U
      - ${PODMAN_SOCK}:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "act_runner", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - "security.stig.compliance=true"

networks:
  proxy-net:
    external: true
  vulnerability-net:
    external: true