services:
  step-ca:
    image: docker.io/smallstep/step-ca:0.28.2
    container_name: step-ca
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "9443:9000"
    volumes:
      - ./data/step:/home/step:z
    environment:
      - DOCKER_STEPCA_INIT_NAME=${STEPCA_CA_NAME:-${DOMAIN} CA}
      - DOCKER_STEPCA_INIT_DNS_NAMES=ca.${DOMAIN},localhost
    networks:
      - pki-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "step", "ca", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=pki"
      - "homepage.group=Security"
      - "homepage.name=Step CA"
      - "homepage.icon=step-ca.png"
      - "homepage.description=Internal Certificate Authority"
      - "homepage.href=https://ca.${DOMAIN}:9443"

networks:
  pki-net:
    driver: bridge
  proxy-net:
    external: true
