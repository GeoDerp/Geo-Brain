services:
  ramalama:
    image: quay.io/ramalama/ramalama:0.17
    container_name: ramalama
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    userns_mode: keep-id
    ports:
      - 8084:8080
    volumes:
      - ${DATA_DIR}/ramalama/models:/tmp/.local/share/ramalama/models:ro
      - ${DATA_DIR}/ramalama/cache:/tmp/.cache:Z
    environment:
      - RAMALAMA_MODEL=${RAMALAMA_MODEL:-phi3:mini}
      - RAMALAMA_TRANSPORT=${RAMALAMA_TRANSPORT:-local}
      - HOME=/tmp
    command: ["ramalama", "serve", "${RAMALAMA_MODEL:-phi3:mini}"]
    networks:
      - secure-backbone
      - wazuh-net
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"] # Assuming there's a healthcheck endpoint
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-analysis"
      - "homepage.group=SOC"
      - "homepage.name=RamaLama (Air-gapped LLM)"
      - "homepage.icon=ramalama.png"
      - "homepage.description=Local Security Analysis"
      - "homepage.href=https://ramalama.${DOMAIN}"
    user: "${PUID:-1000}:${PGID:-1000}"

networks:
  secure-backbone:
    internal: true # No egress for air-gap reliability
  wazuh-net:
    external: true
  vulnerability-net:
    external: true
