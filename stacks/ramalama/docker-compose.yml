services:
  ramalama:
    image: quay.io/ramalama/ramalama:0.17
    container_name: ramalama
    restart: always
    ports:
      - 8084:8080
    volumes:
      - ./models:/root/.local/share/ramalama/models:ro
    environment:
      - RAMALAMA_MODEL=phi3:mini
      - RAMALAMA_TRANSPORT=local
    command: serve phi3:mini
    networks:
      - secure-backbone
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"] # Assuming there's a healthcheck endpoint
      interval: 60s
      timeout: 20s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-analysis"
      - "homepage.group=SOC"
      - "homepage.name=RamaLama (Air-gapped LLM)"
      - "homepage.icon=ramalama.png"
      - "homepage.description=Local Security Analysis"
      - "homepage.href=http://${DOMAIN}:8084"
    user: "1000:1000"

networks:
  secure-backbone:
    internal: true # No egress for air-gap reliability
