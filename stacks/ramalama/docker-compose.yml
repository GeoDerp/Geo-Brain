services:
  ramalama:
    image: quay.io/ramalama/ramalama:0.17
    container_name: ramalama
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    userns_mode: keep-id
    ports:
      - 8084:8080
    volumes:
      - ${DATA_DIR}/ramalama:/var/lib/ramalama:Z
    environment:
      - RAMALAMA_MODEL=${RAMALAMA_MODEL:-phi3:mini}
      - RAMALAMA_TRANSPORT=${RAMALAMA_TRANSPORT:-ollama}
      - HOME=/var/lib/ramalama
    command: ["ramalama", "serve", "${RAMALAMA_MODEL:-phi3:mini}"]
    networks:
      - secure-backbone
      - wazuh-net
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/1/status"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-analysis"
      - "traefik.enable=true"
      - "traefik.http.routers.ramalama.rule=Host(`ai.${DOMAIN}`)"
      - "traefik.http.routers.ramalama.entrypoints=websecure"
      - "traefik.http.routers.ramalama.tls=true"
      - "traefik.http.routers.ramalama.tls.certresolver=stepca"
      - "traefik.http.routers.ramalama.middlewares=oauth2-proxy-admin@file,security-headers@file"
      - "traefik.http.services.ramalama.loadbalancer.server.port=8080"
      - "homepage.group=SOC"
      - "homepage.name=RamaLama (Air-gapped LLM)"
      - "homepage.icon=ramalama.png"
      - "homepage.description=Local Security Analysis"
    user: "${PUID:-1000}:${PGID:-1000}"

networks:
  secure-backbone:
    external: true
  wazuh-net:
    external: true
  vulnerability-net:
    external: true
