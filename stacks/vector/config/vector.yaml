sources:
  journald:
    type: journald
  podman_logs:
    type: docker_logs
  falco_alerts:
    type: http_server
    address: "0.0.0.0:8686"
    path: "/falco"
    encoding: json
  internal_metrics:
    type: internal_metrics

transforms:
  # Tag security-relevant logs for Wazuh forwarding
  classify_logs:
    type: remap
    inputs:
      - journald
      - podman_logs
    source: |
      .labels.host = get_env_var("HOSTNAME") ?? "unknown"
      .labels.pipeline = "vector"
      src = "system"
      if exists(.SYSLOG_IDENTIFIER) { src = to_string!(.SYSLOG_IDENTIFIER) }
      if src == "system" && exists(.container_name) { src = to_string!(.container_name) }
      .labels.source = src
      msg = to_string(.MESSAGE) ?? to_string(.message) ?? ""
      if match(msg, r'(?i)(authentication|failed|denied|unauthorized|error|CVE|alert|exfil|block|malicious|pkg-sentinel)') {
        .labels.security = "true"
      }

  # Normalize Falco events
  falco_normalize:
    type: remap
    inputs:
      - falco_alerts
    source: |
      .labels.source = "falco"
      .labels.security = "true"
      .labels.host = get_env_var("HOSTNAME") ?? "unknown"

  # Compact security logs for Wazuh (strip large container metadata to fit remoted buffer)
  wazuh_compact:
    type: remap
    inputs:
      - classify_logs
      - falco_normalize
    source: |
      msg = to_string(.message) ?? to_string(.MESSAGE) ?? encode_json(.)
      host = to_string(.labels.host) ?? "-"
      src = to_string(.labels.source) ?? "-"
      cname = to_string(.container_name) ?? "-"
      .message = host + " " + src + "[" + cname + "]: " + msg
      del(.labels)
      del(.container_id)
      del(.container_created_at)
      del(.image)

  # Clean logs for Loki (strip redundant labels and format message)
  loki_clean:
    type: remap
    inputs:
      - classify_logs
      - falco_normalize
    source: |
      # Extract security status
      .security = "false"
      if exists(.labels.security) {
          .security = .labels.security
      }
      
      # Strip bloated metadata
      del(.label)
      del(.container_id)
      del(.container_created_at)
      del(.image)
      del(.source_type)
      del(.stream)
      
      # If message is JSON, try to parse it for better visibility
      if is_string(.message) && starts_with(to_string!(.message), "{") {
          parsed, err = parse_json(.message)
          if err == null {
              if exists(parsed.message) {
                  .message = parsed.message
              }
          }
      }

sinks:
  # All logs → Loki
  loki:
    type: loki
    inputs:
      - loki_clean
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      host: "{{ labels.host }}"
      source: "{{ labels.source }}"
      security: "{{ security }}"
      pipeline: vector

  # Security logs → Wazuh Manager (syslog on port 1514)
  wazuh:
    type: socket
    inputs:
      - wazuh_compact
    mode: tcp
    address: "wazuh-manager:1514"
    encoding:
      codec: text

  # Vector internal metrics → Prometheus
  vector_metrics:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: "0.0.0.0:9598"

  # Note: CrowdSec parses Traefik access logs and host logs directly
  # via its own acquisition pipeline (acquis.yaml). No Vector sink needed.
