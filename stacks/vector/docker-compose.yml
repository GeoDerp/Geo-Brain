services:
  vector:
    image: docker.io/timberio/vector:0.44.0-debian
    container_name: vector
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    volumes:
      - ./config:/etc/vector:z,U
      - /var/log:/var/log:ro
      - vector-data:/var/lib/vector:z,U
      - ${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro # For container logs
    networks:
      - monitoring-net
      - wazuh-net
      - security-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "vector", "--version"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-aggregator"
      - "homepage.group=Observability"
      - "homepage.name=Vector"
      - "homepage.icon=vector.png"
      - "homepage.description=High-performance Log Pipeline"

networks:
  monitoring-net:
    external: true
  wazuh-net:
    external: true
  security-net:
    external: true

volumes:
  vector-data:

