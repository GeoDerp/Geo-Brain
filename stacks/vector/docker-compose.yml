services:
  vector:
    image: timberio/vector:0.44.0-debian
    container_name: vector
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./config:/etc/vector:z
      - /var/log:/var/log:ro
      - ${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro # For container logs
    networks:
      - monitoring-net
      - wazuh-net
      - security-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "vector", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-aggregator"
      - "homepage.group=Observability"
      - "homepage.name=Vector"
      - "homepage.icon=vector.png"
      - "homepage.description=High-performance Log Pipeline"

networks:
  monitoring-net:
    external: true
  wazuh-net:
    external: true
  security-net:
    external: true
