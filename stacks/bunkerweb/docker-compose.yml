# BunkerWeb - L7 Web Application Firewall (WAF) & DDoS Protection
# OPTIONAL STACK: Sits in front of Traefik as an L7 WAF perimeter.
# License: AGPL-3.0
services:
  bunkerweb:
    image: docker.io/bunkerity/bunkerweb-all-in-one:1.6.8
    container_name: bunkerweb
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # AIO image runs internally as UID 101:101 (nginx); cannot override.
    ports:
      - "8081:8080/tcp"
      - "8444:8443/tcp"
    extra_hosts:
      - "traefik:10.89.0.141"
    environment:
      # -- Core --
      SERVER_NAME: "waf.${DOMAIN}"
      MULTISITE: "no"
      DISABLE_DEFAULT_SERVER: "no"
      # -- Reverse proxy to Traefik --
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://traefik:80"
      # -- WAF (ModSecurity + OWASP CRS) --
      USE_MODSECURITY: "yes"
      MODSECURITY_SEC_RULE_ENGINE: "On"
      USE_MODSECURITY_CRS: "yes"
      MODSECURITY_SEC_AUDIT_ENGINE: "On"
      # -- DDoS / Rate Limiting --
      USE_LIMIT_REQ: "yes"
      LIMIT_REQ_URL: "/"
      LIMIT_REQ_RATE: "30r/s"
      USE_LIMIT_CONN: "yes"
      LIMIT_CONN_MAX: "50"
      # -- Anti-Bot --
      USE_ANTIBOT: "no"
      # -- Trusted Proxies --
      USE_PROXY: "yes"
      USE_REAL_IP: "yes"
      REAL_IP_FROM: "10.89.0.0/16,127.0.0.1"
      REAL_IP_HEADER: "X-Forwarded-For"
      DNS_RESOLVERS: "10.89.0.1"
      WHITELIST_IPS: "127.0.0.1,10.89.0.0/16"
      USE_BAD_BEHAVIOR: "yes"
      BAD_BEHAVIOR_STATUS_CODES: "400 401 403 404 405 429 444"
      BAD_BEHAVIOR_THRESHOLD: "20"
      BAD_BEHAVIOR_BAN_TIME: "86400"
      # -- IP Blacklists & DNSBL --
      USE_BLACKLIST: "yes"
      USE_DNSBL: "yes"
      DNSBL_LIST: "bl.blocklist.de problems.dnsbl.sorbs.net sbl.spamhaus.org xbl.spamhaus.org"
      # -- Security Headers --
      USE_SECURITY_HEADERS: "yes"
      STRICT_TRANSPORT_SECURITY: "max-age=63072000; includeSubDomains; preload"
      CONTENT_SECURITY_POLICY: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
      REFERRER_POLICY: "strict-origin-when-cross-origin"
      X_CONTENT_TYPE_OPTIONS: "nosniff"
      X_FRAME_OPTIONS: "SAMEORIGIN"
      # -- TLS --
      AUTO_LETS_ENCRYPT: "no"
      # -- CrowdSec (integrated in AIO) --
      USE_CROWDSEC: "yes"
      # -- UI --
      SERVICE_UI: "yes"
      # -- Logging --
      LOG_LEVEL: "info"
      # -- Metrics --
      USE_PROMETHEUS: "yes"
    volumes:
      - ${DATA_DIR}/bunkerweb:/data:Z,U
    networks:
      - waf-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bunkerweb.rule=Host(`waf.${DOMAIN}`)"
      - "traefik.http.routers.bunkerweb.entrypoints=websecure"
      - "traefik.http.routers.bunkerweb.tls=true"
      - "traefik.http.routers.bunkerweb.tls.certresolver=stepca"
      - "traefik.http.routers.bunkerweb.middlewares=oauth2-proxy-admin@file,security-headers@file"
      - "traefik.http.services.bunkerweb.loadbalancer.server.port=7000"
      - "traefik.docker.network=proxy-net"
      - "security.stig.compliance=true"
      - "security.stig.bypass_privileged=true"
      - "security.stig.role=waf"
      - "homepage.group=Security"
      - "homepage.name=BunkerWeb"
      - "homepage.icon=bunkerweb.png"
      - "homepage.description=L7 WAF & DDoS Protection"
      - "homepage.href=https://waf.${DOMAIN}"

networks:
  waf-net:
    driver: bridge
    internal: true
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=waf-network"
  proxy-net:
    external: true
