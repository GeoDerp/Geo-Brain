services:
  harbor-log:
    image: goharbor/harbor-log:v2.14.2
    container_name: harbor-log
    restart: always
    volumes:
      - ./data/log:/var/log/harbor/:z
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD-SHELL", "test -d /var/log/harbor"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log"

  harbor-db:
    image: goharbor/harbor-db:v2.14.2
    container_name: harbor-db
    restart: always
    volumes:
      - ./data/database:/var/lib/postgresql/data:Z
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=database"

  harbor-redis:
    image: goharbor/redis-photon:v2.14.2
    container_name: harbor-redis
    restart: always
    volumes:
      - ./data/redis:/data:Z
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=cache"

  harbor-core:
    image: goharbor/harbor-core:v2.14.2
    container_name: harbor-core
    restart: always
    ports:
      - 8082:8080
    volumes:
      - ./data/core:/data:z
      - ./config/core:/etc/harbor:z
    depends_on:
      - harbor-log
      - harbor-db
      - harbor-redis
    networks:
      - harbor-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2.0/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=core"
      - "homepage.group=Security"
      - "homepage.name=Harbor"
      - "homepage.icon=harbor.png"
      - "homepage.description=Local Registry & Cache"
      - "homepage.href=https://harbor.${DOMAIN}"

  harbor-portal:
    image: goharbor/harbor-portal:v2.14.2
    container_name: harbor-portal
    restart: always
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=ui"

  harbor-jobservice:
    image: goharbor/harbor-jobservice:v2.14.2
    container_name: harbor-jobservice
    restart: always
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=job-worker"

  registry:
    image: goharbor/registry-photon:v2.14.2
    container_name: registry
    restart: always
    networks:
      - harbor-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=registry"

networks:
  harbor-net:
    driver: bridge
  proxy-net:
    external: true
