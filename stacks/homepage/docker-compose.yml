services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.9.13
    container_name: homepage
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config:z
      - ${PODMAN_SOCK}:/var/run/docker.sock:ro
    networks:
      - mgmt-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=dashboard"
      - "homepage.group=Management"
      - "homepage.name=Dashboard"
      - "homepage.icon=homepage.png"
      - "homepage.description=Service Dashboard"
      - "homepage.href=https://home.${DOMAIN}"

networks:
  mgmt-net:
    external: true
