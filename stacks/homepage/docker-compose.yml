services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.9.13
    container_name: homepage
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    ports:
      - 3000:3000
    environment:
      - HOMEPAGE_VAR_DISABLE_UPDATE_CHECK=true
    volumes:
      - ./config:/app/config:z,U
      - ${PODMAN_SOCK}:/var/run/docker.sock:ro
    networks:
      - mgmt-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.middlewares=authelia@file,security-headers@file"
      - "authelia.access_control.policy=one_factor"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "security.stig.compliance=true"
      - "security.stig.role=dashboard"
      - "homepage.group=Management"
      - "homepage.name=Dashboard"
      - "homepage.icon=homepage.png"
      - "homepage.description=Service Dashboard"
      - "homepage.href=https://home.${DOMAIN}"

networks:
  mgmt-net:
    external: true
  proxy-net:
    external: true
