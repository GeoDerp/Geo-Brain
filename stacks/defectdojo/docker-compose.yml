services:
  defectdojo-django:
    image: defectdojo/defectdojo-django:2.55.4
    container_name: defectdojo-django
    restart: always
    depends_on:
      - defectdojo-db
      - defectdojo-redis
    environment:
      - DD_DATABASE_URL=postgres://${DEFECTDOJO_DB_USER:-defectdojo}:${DEFECTDOJO_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      - DD_CELERY_BROKER_URL=redis://defectdojo-redis:6379/0
    networks:
      - vulnerability-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=vulnerability-mgmt"
      - "homepage.group=SOC"
      - "homepage.name=DefectDojo"
      - "homepage.icon=defectdojo.png"
      - "homepage.description=Vulnerability Management"
      - "homepage.href=https://defectdojo.${DOMAIN}"

  defectdojo-db:
    image: postgres:15-alpine
    container_name: defectdojo-db
    restart: always
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=${DEFECTDOJO_DB_USER:-defectdojo}
      - POSTGRES_PASSWORD=${DEFECTDOJO_DB_PASSWORD}
    volumes:
      - ./data/database:/var/lib/postgresql/data:Z
    networks:
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEFECTDOJO_DB_USER:-defectdojo}"]
      interval: 30s
      timeout: 10s
      retries: 3

  defectdojo-redis:
    image: valkey/valkey:7.2.12
    container_name: defectdojo-redis
    restart: always
    networks:
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vulnerability-net:
    driver: bridge
  proxy-net:
    external: true
