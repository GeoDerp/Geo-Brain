services:
  defectdojo-django:
    image: docker.io/defectdojo/defectdojo-django:2.55.4
    container_name: defectdojo-django
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - defectdojo-db
      - defectdojo-redis
    environment:
      - DD_SECRET_KEY=${DOJO_SECRET_KEY}
      - DD_DATABASE_URL=postgres://${DEFECTDOJO_DB_USER:-defectdojo}:${DEFECTDOJO_DB_PASSWORD}@defectdojo-db:5432/defectdojo
      - DD_CELERY_BROKER_URL=redis://defectdojo-redis:6379/0
      - DD_SOCIAL_AUTH_OIDC_OIDC_ENDPOINT=https://kanidm.${DOMAIN}/oauth2/openid/defectdojo
      - DD_SOCIAL_AUTH_OIDC_KEY=defectdojo
      - DD_SOCIAL_AUTH_OIDC_SECRET=${DOJO_OIDC_SECRET}
    #secrets:
      #- dojo_oidc_secret
    networks:
      - vulnerability-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/healthcheck')\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.defectdojo.rule=Host(`defectdojo.${DOMAIN}`)"
      - "traefik.http.routers.defectdojo.entrypoints=websecure"
      - "traefik.http.routers.defectdojo.tls=true"
      - "traefik.http.routers.defectdojo.middlewares=authelia@file,security-headers@file"
      - "traefik.http.services.defectdojo.loadbalancer.server.port=8080"
      - "security.stig.compliance=true"
      - "security.stig.role=vulnerability-mgmt"
      - "homepage.group=SOC"
      - "homepage.name=DefectDojo"
      - "homepage.icon=defectdojo.png"
      - "homepage.description=Vulnerability Management"
      - "homepage.href=https://defectdojo.${DOMAIN}"

  defectdojo-db:
    image: docker.io/library/postgres:15-alpine
    container_name: defectdojo-db
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=${DEFECTDOJO_DB_USER:-defectdojo}
      - POSTGRES_PASSWORD=${DEFECTDOJO_DB_PASSWORD}
    volumes:
      - ${DATA_DIR}/defectdojo/database:/var/lib/postgresql/data:Z,U
    networks:
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEFECTDOJO_DB_USER:-defectdojo}"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=database"

  defectdojo-redis:
    image: docker.io/valkey/valkey:7.2.12
    container_name: defectdojo-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    networks:
      - vulnerability-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=cache"

networks:
  vulnerability-net:
    external: true
  proxy-net:
    external: true

#secrets:
  dojo_oidc_secret:
    external: true
