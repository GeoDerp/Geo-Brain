services:
  wazuh-indexer:
    image: docker.io/wazuh/wazuh-indexer:4.14.3
    container_name: wazuh-indexer
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OPENSEARCH_JAVA_OPTS=${WAZUH_INDEXER_JAVA_OPTS:--Xms512m -Xmx512m}
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - ${DATA_DIR}/wazuh/indexer:/var/lib/opensearch/data:Z,U
      - ./config/indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro,U
    networks:
      wazuh-net:
        aliases:
          - wazuh.indexer
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9200'"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 5m
    labels:
      - "kanidm.oidc.client_id=wazuh"
      - "security.stig.compliance=true"
      - "security.stig.role=indexer"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Indexer"
      - "homepage.icon=wazuh.png"

  wazuh-manager:
    image: docker.io/wazuh/wazuh-manager:4.14.3
    container_name: wazuh-manager
    restart: always
    # NOTE: no-new-privileges omitted — manager runs multiple exec'd processes
    # (cp, chmod, chown) that need capability inheritance via uid 0 in userns.
    # seccomp:unconfined needed — Filebeat cgo pthread_create gets EPERM due to
    # Podman's default seccomp + cgroup pids limit interactions.
    security_opt:
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETUID
      - SETGID
      - SYS_CHROOT
    ports:
      - 1514:1514
      - 1515:1515
      - 55000:55000
    volumes:
      - ${DATA_DIR}/wazuh/manager:/var/ossec/data:Z,U
      - ./config/manager/filebeat.yml:/etc/filebeat/filebeat.yml:ro
    networks:
      wazuh-net:
        aliases:
          - wazuh.manager
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "kanidm.oidc.client_id=wazuh"
      - "security.stig.compliance=true"
      - "security.stig.bypass_privileged=true"
      - "security.stig.role=manager"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Manager"
      - "homepage.icon=wazuh.png"

  wazuh-dashboard:
    image: docker.io/wazuh/wazuh-dashboard:4.14.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["bash", "-c"]
    command:
      - |
        /usr/share/wazuh-dashboard/bin/opensearch-dashboards-plugin remove securityDashboards --allow-root 2>/dev/null || true
        exec /entrypoint.sh
    volumes:
      - ./config/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro,U
      - ./config/dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro,U
    container_name: wazuh-dashboard
    restart: always
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      - WAZUH_MANAGER_URL=https://wazuh-manager
      - INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
    networks:
      - wazuh-net
      - monitoring-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5601'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh.rule=Host(`wazuh.${DOMAIN}`)"
      - "traefik.http.routers.wazuh.entrypoints=websecure"
      - "traefik.http.routers.wazuh.tls=true"
      - "traefik.http.routers.wazuh.middlewares=oauth2-proxy-admin@file,security-headers@file"
      - "traefik.http.services.wazuh.loadbalancer.server.port=5601"
      - "traefik.docker.network=proxy-net"
      - "security.stig.compliance=true"
      - "security.stig.role=dashboard"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Dashboard"
      - "homepage.icon=wazuh.png"
      - "homepage.description=Security Monitoring Dashboard"
      - "homepage.href=https://wazuh.${DOMAIN}"

networks:
  wazuh-net:
    external: true
  monitoring-net:
    external: true
  proxy-net:
    external: true
