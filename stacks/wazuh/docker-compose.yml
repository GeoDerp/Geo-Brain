services:
  wazuh-indexer:
    image: docker.io/wazuh/wazuh-indexer:4.14.3
    container_name: wazuh-indexer
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OPENSEARCH_JAVA_OPTS=${WAZUH_INDEXER_JAVA_OPTS:--Xms512m -Xmx512m}
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - discovery.type=single-node
      - plugins.security.disabled=true
    volumes:
      - ${DATA_DIR}/wazuh/indexer:/var/lib/opensearch/data:Z,U
      - ./config/indexer/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro,U
    networks:
      wazuh-net:
        aliases:
          - wazuh.indexer
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200"]
      interval: 5m
      timeout: 10s
      retries: 5
      start_period: 5m
    labels:
      - "kanidm.oidc.client_id=wazuh"
      - "security.stig.compliance=true"
      - "security.stig.role=indexer"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Indexer"
      - "homepage.icon=wazuh.png"

  wazuh-manager:
    image: docker.io/wazuh/wazuh-manager:4.14.3
    container_name: wazuh-manager
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - 1514:1514
      - 1515:1515
      - 55000:55000
    volumes:
      - ${DATA_DIR}/wazuh/manager:/var/ossec/data:Z,U
      - ./config/manager/filebeat.yml:/etc/filebeat/filebeat.yml:ro
    networks:
      wazuh-net:
        aliases:
          - wazuh.manager
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "kanidm.oidc.client_id=wazuh"
      - "security.stig.compliance=true"
      - "security.stig.role=manager"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Manager"
      - "homepage.icon=wazuh.png"

  wazuh-dashboard:
    image: docker.io/wazuh/wazuh-dashboard:4.14.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro,U
    container_name: wazuh-dashboard
    restart: always
    ports:
      - 5601:5601
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      - WAZUH_MANAGER_URL=http://wazuh-manager
      - INDEXER_URL=http://wazuh-indexer:9200
    networks:
      - wazuh-net
      - monitoring-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh.rule=Host(`wazuh.${DOMAIN}`)"
      - "traefik.http.routers.wazuh.entrypoints=websecure"
      - "traefik.http.routers.wazuh.tls=true"
      - "traefik.http.routers.wazuh.middlewares=authelia@file,security-headers@file"
      - "authelia.access_control.policy=two_factor"
      - "traefik.http.services.wazuh.loadbalancer.server.port=5601"
      - "security.stig.compliance=true"
      - "security.stig.role=dashboard"
      - "homepage.group=SOC"
      - "homepage.name=Wazuh Dashboard"
      - "homepage.icon=wazuh.png"
      - "homepage.description=Security Monitoring Dashboard"
      - "homepage.href=https://wazuh.${DOMAIN}"

networks:
  wazuh-net:
    external: true
  monitoring-net:
    external: true
  proxy-net:
    external: true
