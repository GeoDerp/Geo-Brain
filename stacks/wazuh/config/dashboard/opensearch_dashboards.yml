# Geo-Brain Wazuh Dashboard Config
# Configures native OpenID Connect (OIDC) authentication using Kanidm.
server.host: 0.0.0.0
server.port: 5601
opensearch.hosts: ["http://wazuh-indexer:9200"]
opensearch_security.auth.type: "openid"
opensearch_security.auth.multiple_auth_enabled: false
opensearch_security.openid.connect_url: "${OIDC_ENDPOINT}/.well-known/openid-configuration"
opensearch_security.openid.client_id: "${OIDC_CLIENT_ID}"
opensearch_security.openid.client_secret: "${OIDC_CLIENT_SECRET}"
opensearch_security.openid.scope: "openid profile email groups"
opensearch_security.openid.base_redirect_url: "https://wazuh.${DOMAIN}"
# Allows the backend to trust our internal Step-CA
opensearch.ssl.verificationMode: none
# Allows logout
opensearch_security.openid.logout_url: "${OIDC_ENDPOINT}/logout"
# Maps the 'groups' claim from Kanidm to the backend_roles attribute
opensearch_security.openid.roles_key: "groups"
# Maps the user's name to the 'preferred_username' claim
opensearch_security.openid.subject_key: "preferred_username"
