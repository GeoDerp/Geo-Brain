services:
  grafana:
    image: docker.io/grafana/grafana:11.5.1
    container_name: grafana
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana:Z,U
      - ./config/provisioning:/etc/grafana/provisioning:z,U
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
    networks:
      - monitoring-net
      - wazuh-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=authelia@file,security-headers@file"
      - "authelia.access_control.policy=two_factor"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "security.stig.compliance=true"
      - "security.stig.role=visualization"
      - "homepage.group=Observability"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.description=Monitoring & Dashboard"
      - "homepage.href=https://grafana.${DOMAIN}"

networks:
  monitoring-net:
    external: true
  wazuh-net:
    external: true
  proxy-net:
    external: true
