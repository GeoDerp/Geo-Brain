services:
  grafana:
    image: docker.io/grafana/grafana:11.5.1
    container_name: grafana
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana:Z,U
      - ./config/provisioning:/etc/grafana/provisioning:z,U
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}/
      - GF_SERVER_INSTANCE_NAME=My-HomeLab
      - GF_USERS_ALLOW_SIGN_UP=true # OIDC users are created on first login
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Kanidm
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://kanidm.${DOMAIN}/ui/oauth2
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://kanidm.${DOMAIN}/oauth2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://kanidm.${DOMAIN}/oauth2/openid/grafana/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=false
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH="contains(groups[*], 'stig_admins@${DOMAIN}') && 'Admin' || 'Viewer'"
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/platform-health.json
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
      - GF_AUTH_PROXY_ENABLED=false
      - GF_AUTH_PROXY_HEADER_NAME=X-Auth-Request-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=false
    networks:
      - monitoring-net
      - wazuh-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "kanidm.oidc.client_id=grafana"
      - "kanidm.oidc.redirect_path=/login/generic_oauth"
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=stepca"
      - "traefik.http.routers.grafana.middlewares=security-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy-net"
      - "security.stig.compliance=true"
      - "security.stig.role=visualization"
      - "homepage.group=Observability"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.description=Monitoring & Dashboard"
      - "homepage.href=https://grafana.${DOMAIN}"

networks:
  monitoring-net:
    external: true
  wazuh-net:
    external: true
  proxy-net:
    external: true
