services:
  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: always
    ports:
      - 3001:3000
    volumes:
      - ./data:/var/lib/grafana:Z
      - ./config/provisioning:/etc/grafana/provisioning:z
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=visualization"
      - "homepage.group=Observability"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.description=Monitoring & Dashboard"
      - "homepage.href=http://${DOMAIN}:3001"

networks:
  monitoring-net:
    external: true
