  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ${DATA_DIR}/certs:/certs:ro # Mount step-ca root/client certs
  #   depends_on:
  #     - app-backend
  #   labels:
  #     - "security.stig.compliance=true"

networks:
  proxy-net:
    external: true
  # app-db-net:
  #   internal: true # Internal network drops default gateway routing
