  # =========================================================================
  # OPTIONAL mTLS SIDECAR PATTERN
  # =========================================================================
  # Applications bind strictly to 127.0.0.1 and share a network namespace 
  # with a sidecar proxy that handles mTLS termination via Step-CA.
  #
  # app-backend:
  #   image: my-backend-image:latest
  #   container_name: my-app-backend
  #   # Bind application strictly to localhost inside the pod
  #   command: ["--bind", "127.0.0.1:8080"]
  #   # No networks defined here; network is shared from the sidecar OR vice-versa
  #   # Usually, the main app defines the network, and sidecar uses network_mode.
  #   networks:
  #     - app-mtls-net
  #   ...
  #
  # app-mtls-sidecar:
  #   image: docker.io/library/caddy:2-alpine
