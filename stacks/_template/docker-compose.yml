# =============================================================================
# GEO-BRAIN USER STACK TEMPLATE
# =============================================================================
# Use this template to deploy your own web applications securely.
# 
# Instructions:
# 1. Copy this folder to a new name: `cp -r stacks/_template stacks/user/my-app`
# 2. Update all instances of `my-app` to your application's name.
# 3. Add your application image, volumes, and specific environment variables.
# 4. Deploy using: `./deploy.sh user/my-app up`

services:
  web:
    image: docker.io/library/nginx:alpine # REPLACE WITH YOUR APP IMAGE
    container_name: my-app
    restart: always
    security_opt:
      - no-new-privileges:true
    # Run as a non-root user for STIG compliance (most images support this)
    # user: "${PUID:-1000}:${PGID:-1000}"
    # userns_mode: keep-id
    networks:
      - proxy-net
      # - app-db-net # Uncomment if using a backend database
    volumes:
      # Map persistent data to the centralized DATA_DIR
      - ${DATA_DIR}/my-app/data:/usr/share/nginx/html:Z,U
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      # Ensure you define a valid healthcheck for your app
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      
      # --- Traefik Routing & TLS ---
      - "traefik.enable=true"
      - "traefik.http.routers.my-app.rule=Host(`my-app.${DOMAIN}`)"
      - "traefik.http.routers.my-app.entrypoints=websecure"
      - "traefik.http.routers.my-app.tls=true"
      - "traefik.http.routers.my-app.tls.certresolver=stepca"
      - "traefik.http.services.my-app.loadbalancer.server.port=80" # Change to your app's internal port

      # --- Authelia SSO Protection (Optional but Recommended) ---
      # Remove 'authelia@file,' below if your app handles its own authentication or is public
      - "traefik.http.routers.my-app.middlewares=authelia@file,security-headers@file"

      # --- Homepage Integration (Optional) ---
      - "homepage.group=Services"
      - "homepage.name=My App"
      - "homepage.icon=nginx.png"
      - "homepage.description=My Custom Web Application"
      - "homepage.href=https://my-app.${DOMAIN}"

