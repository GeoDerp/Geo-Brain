# =============================================================================
# Stack Name: <STACK_NAME>
# Description: <Brief description of the service>
# License: <License identifier>
# =============================================================================
# Usage:
#   1. Copy this directory:  cp -r _template stacks/<your-stack-name>
#   2. Update image, ports, volumes, and labels below.
#   3. Add any required secrets as Podman secrets and reference them.
#   4. Deploy:  ./deploy.sh <your-stack-name> up
#
# DISA STIG / GEMINI.md Checklist:
#   [x] Image pinned to exact version (no :latest)
#   [x] deploy.resources.limits defined (memory + cpus)
#   [x] healthcheck defined
#   [x] Runs rootless via ${PUID}:${PGID}
#   [x] Dedicated network (no inter-stack unless justified)
#   [x] STIG compliance labels present
#   [x] read_only: true, cap_drop: ALL, and tmpfs mounted for STIG compliance
#   [x] No hardcoded secrets (use podman secrets instead)
# =============================================================================

services:
  <service-name>:
    image: <registry>/<image>:<pinned-version>
    container_name: <service-name>
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run
    ports:
      - "${<SERVICE>_PORT:-<default-host-port>}:<container-port>"
    volumes:
      - ${DATA_DIR}/<service-name>:/data:Z,U
      # - ./config:/config:z    # Uncomment if the service needs config mounts
    # Use secrets instead of environment variables for sensitive data
    environment:
      # - EXAMPLE_VAR=${EXAMPLE_VAR:-default_value}
      # - DISABLE_TELEMETRY=true # Always disable telemetry in apps that support it
    # secrets:
    #   - source: example_secret
    #     target: /run/secrets/example_secret
    networks:
      - <stack>-net
      # - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:<container-port>/health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=<role>"
      # Declarative Zero-Trust Proxy labels (Traefik)
      # - "traefik.enable=true"
      # - "traefik.http.routers.<service-name>.rule=Host(`<subdomain>.${DOMAIN}`)"
      # - "traefik.http.routers.<service-name>.entrypoints=websecure"
      # - "traefik.http.routers.<service-name>.tls=true"
      # - "traefik.http.routers.<service-name>.middlewares=authelia@file,security-headers@file"
      # - "traefik.http.services.<service-name>.loadbalancer.server.port=<container-port>"
      # Uncomment and customise for Homepage dashboard integration:
      # - "homepage.group=<Group>"
      # - "homepage.name=<Display Name>"
      # - "homepage.icon=<icon>.png"
      # - "homepage.description=<Short description>"
      # - "homepage.href=https://<subdomain>.${DOMAIN}"

# secrets:
#   example_secret:
#     external: true

networks:
  <stack>-net:
    driver: bridge
    # If this stack needs to talk to Traefik, replace with:
    # proxy-net:
    #   external: true
