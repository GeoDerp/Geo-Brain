# =============================================================================
# GEO-BRAIN USER STACK TEMPLATE
# =============================================================================
# Use this template to deploy your own web applications securely.
# 
# Instructions:
# 1. Copy this folder to a new name: `cp -r stacks/_template stacks/user/my-app`
# 2. Update all instances of `my-app` to your application's name.
# 3. Add your application image, volumes, and specific environment variables.
# 4. Deploy using: `./deploy.sh user/my-app up`

services:
  web:
    image: docker.io/library/nginx:1.27.2-alpine # REPLACE WITH YOUR APP IMAGE
    container_name: my-app
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    # Run as a non-root user for STIG compliance (most images support this)
    # user: "${PUID:-1000}:${PGID:-1000}"
    # userns_mode: keep-id
    networks:
      - proxy-net
      # - app-db-net # Uncomment if using a backend database
    volumes:
      # Map persistent data to the centralized DATA_DIR
      - ${DATA_DIR}/my-app/data:/usr/share/nginx/html:Z,U
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      
      # --- Kanidm OIDC Integration (Optional) ---
      # Automatically registers this app as an OIDC client in Kanidm and sets up the landing URL.
      # The generated secret will be placed in your .env as MY_APP_OIDC_SECRET
      # - "kanidm.oidc.client_id=my-app"

      # --- Traefik Routing & TLS ---
      - "traefik.enable=true"
      - "traefik.http.routers.my-app.rule=Host(`my-app.${DOMAIN}`)"
      - "traefik.http.routers.my-app.entrypoints=websecure"
      - "traefik.http.routers.my-app.tls=true"
      - "traefik.http.routers.my-app.tls.certresolver=stepca"
      - "traefik.http.services.my-app.loadbalancer.server.port=80" # Change to your app's internal port

      # --- OAuth2 Proxy SSO Protection (Optional but Recommended) ---
      # Remove 'oauth2-proxy@file,' below if your app handles its own authentication or is public
      - "traefik.http.routers.my-app.middlewares=oauth2-proxy@file,security-headers@file"

      # --- Homepage Integration ---
      # Add a manual entry in stacks/homepage/config/services.yaml:
      #   - My App:
      #       icon: nginx.png
      #       href: "https://my-app.example.local"
      #       description: My Custom Web Application
      #       server: podman
      #       container: my-app

