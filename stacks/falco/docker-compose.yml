services:
  falco:
    image: docker.io/falcosecurity/falco:0.43.0
    container_name: falco
    restart: always
    security_opt:
      - no-new-privileges:true
    privileged: true
    # eBPF/modern_ebpf fails in rootless due to kernel.unprivileged_bpf_disabled=2
    # Falling back to nodriver so Falco can run and monitor container metadata.
    volumes:
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./config/falco.yaml:/etc/falco/falco.yaml:ro,U
      - ${DATA_DIR}/falco/log:/var/log/falco:Z
    command: ["falco", "-o", "engine.kind=nodriver"]
    networks:
      - security-net
      - monitoring-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=runtime-security"
      - "security.stig.bypass_privileged=true"
      - "homepage.group=SOC"
      - "homepage.name=Falco"
      - "homepage.icon=falco.png"
      - "homepage.description=Runtime Security (nodriver)"

networks:
  security-net:
    external: true
  monitoring-net:
    external: true
