services:
  traefik:
    image: docker.io/library/traefik:v3.3.4
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /plugins-storage
      - /plugins-local
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config:/etc/traefik:z,U
      - ./config/certs:/etc/traefik/certs:ro,U
      - ${DATA_DIR}/traefik/logs:/var/log/traefik:Z,U
      - ${DATA_DIR}/traefik/acme:/etc/traefik/acme:Z,U
      - ${PODMAN_SOCK}:/var/run/docker.sock:ro,z
    environment:
      - LEGO_CA_CERTIFICATES=/etc/traefik/certs/root_ca.crt
      - DOCKER_API_VERSION=1.40
      - DOMAIN=${DOMAIN}
    networks:
      - proxy-net
      - identity-net
      - mgmt-net
      - monitoring-net
      - security-net
      - wazuh-net
      - vulnerability-net
      - quay-net
      - pki-net
      - storage-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=stepca"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=oauth2-proxy-admin@file,security-headers@file"
      - "security.stig.compliance=true"
      - "security.stig.role=proxy"
      - "homepage.group=Management"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.description=Edge Proxy"
      - "homepage.href=https://traefik.${DOMAIN}"

networks:
  proxy-net:
    external: true
  identity-net:
    external: true
  mgmt-net:
    external: true
  monitoring-net:
    external: true
  security-net:
    external: true
  wazuh-net:
    external: true
  vulnerability-net:
    external: true
  quay-net:
    external: true
  pki-net:
    external: true
  storage-net:
    external: true
