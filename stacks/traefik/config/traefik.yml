# Traefik Static Configuration
# Ref: https://doc.traefik.io/traefik/reference/static-configuration/file/

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}
      middlewares:
        - crowdsec@file
  metrics:
    address: ":8082"

ping:
  entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
