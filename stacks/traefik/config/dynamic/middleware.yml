# Traefik Dynamic Configuration — Middlewares & Transports
# Routers/services are defined via Docker labels on each compose service.
# Ref: https://doc.traefik.io/traefik/reference/dynamic-configuration/file/

http:
  middlewares:
    # Authelia ForwardAuth middleware — applied to protected services via labels
    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email
          - Remote-Name

    # CrowdSec bouncer middleware — requires Traefik plugin installation
    # Uncomment after installing crowdsec-bouncer-traefik-plugin
    # crowdsec:
    #   plugin:
    #     crowdsec-bouncer-traefik-plugin:
    #       enabled: true
    #       crowdsecLapiScheme: http
    #       crowdsecLapiHost: "crowdsec:8080"
    #       crowdsecLapiKey: '{{env "CROWDSEC_BOUNCER_API_KEY"}}'

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

  serversTransports:
    insecure-skip-verify:
      insecureSkipVerify: true
