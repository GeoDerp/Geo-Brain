# Traefik Dynamic Configuration — Middlewares & Transports
# Routers/services are defined via Docker labels on each compose service.
# Ref: https://doc.traefik.io/traefik/reference/dynamic-configuration/file/

http:
  middlewares:
    # OAuth2 Proxy ForwardAuth — natively redirects unauthenticated users to Kanidm
    oauth2-proxy:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/start"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups

    # OAuth2 Proxy Admin ForwardAuth — only brain_admins group can access
    oauth2-proxy-admin:
      forwardAuth:
        address: "http://oauth2-proxy-admin:4180/admin-oauth2/start"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups

    # Redirect to login page on 401 Unauthorized
    auth-error:
      errors:
        status:
          - "401"
        service: auth-error-svc
        query: "/oauth2/start"

    # Redirect to admin login page on 401 Unauthorized
    auth-admin-error:
      errors:
        status:
          - "401"
        service: auth-admin-error-svc
        query: "/admin-oauth2/start"

    # CrowdSec bouncer middleware — blocks IPs flagged by CrowdSec LAPI
    crowdsec:
      plugin:
        crowdsec-bouncer-traefik-plugin:
          enabled: true
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKey: '${CROWDSEC_BOUNCER_API_KEY}'

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

  services:
    # Dummy services for auth-error middleware
    auth-error-svc:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"
    auth-admin-error-svc:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy-admin:4180"

  serversTransports:
    insecure-skip-verify:
      insecureSkipVerify: true
