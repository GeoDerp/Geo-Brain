# Traefik Dynamic Configuration — Middlewares & Transports
# Routers/services are defined via Docker labels on each compose service.
# Ref: https://doc.traefik.io/traefik/reference/dynamic-configuration/file/

http:
  middlewares:
    # OAuth2 Proxy ForwardAuth — checks session cookie at root; returns 202 for
    # authenticated users (--upstream=static://202), 302 to Kanidm for unauthenticated.
    oauth2-proxy:
      forwardAuth:
        address: "http://oauth2-proxy:4180/"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups

    # OAuth2 Proxy Admin ForwardAuth — only stig_admins group can access
    oauth2-proxy-admin:
      forwardAuth:
        address: "http://oauth2-proxy-admin:4180/"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Groups

    # CrowdSec bouncer middleware — blocks IPs flagged by CrowdSec LAPI
    crowdsec:
      plugin:
        crowdsec-bouncer-traefik-plugin:
          enabled: true
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKey: '${CROWDSEC_BOUNCER_API_KEY}'

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: false
        stsPreload: false
        stsSeconds: 0
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

  serversTransports:
    insecure-skip-verify:
      insecureSkipVerify: true
