services:
  loki:
    image: docker.io/grafana/loki:3.4.1
    container_name: loki
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    ports:
      - 3100:3100
    volumes:
      - ./config:/etc/loki:z,U
      - ${DATA_DIR}/loki:/loki:Z,U
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - monitoring-net
      - storage-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "loki", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-storage"
      - "homepage.group=Observability"
      - "homepage.name=Loki"
      - "homepage.icon=loki.png"
      - "homepage.description=Log Aggregation System"

networks:
  monitoring-net:
    external: true
  storage-net:
    external: true
