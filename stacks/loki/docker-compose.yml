services:
  loki:
    image: grafana/loki:3.4.1
    container_name: loki
    restart: always
    user: "10001:10001"
    ports:
      - 3100:3100
    volumes:
      - ./config:/etc/loki:z
      - ./data:/loki:Z
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring-net
      - storage-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=log-storage"
      - "homepage.group=Observability"
      - "homepage.name=Loki"
      - "homepage.icon=loki.png"
      - "homepage.description=Log Aggregation System"

networks:
  monitoring-net:
    external: true
  storage-net:
    external: true
