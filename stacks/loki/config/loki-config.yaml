auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    # SeaweedFS replaced MinIO as the S3-compatible storage backend (see deploy.sh get_base_stacks).
    # SeaweedFS S3 gateway runs on port 8333 inside the 'seaweedfs' container.
    s3:
      endpoint: seaweedfs:8333
      insecure: true
      bucketnames: loki-data
      access_key_id: ${MINIO_ROOT_USER:-minioadmin}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      s3forcepathstyle: true
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: s3
