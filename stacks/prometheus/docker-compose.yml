services:
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: prometheus
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    volumes:
      - ./config:/etc/prometheus:z
      - ${DATA_DIR}/prometheus:/prometheus:Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/console_templates'
    ports:
      - 9092:9090
    networks:
      - monitoring-net
      - proxy-net
      - security-net
      - wazuh-net
      - storage-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "security.stig.compliance=true"
      - "security.stig.role=metrics-storage"
      - "homepage.group=Observability"
      - "homepage.name=Prometheus"
      - "homepage.icon=prometheus.png"
      - "homepage.description=Metrics Monitoring"
      - "homepage.href=https://prometheus.${DOMAIN}"

networks:
  monitoring-net:
    external: true
  proxy-net:
    external: true
  security-net:
    external: true
  wazuh-net:
    external: true
  storage-net:
    external: true