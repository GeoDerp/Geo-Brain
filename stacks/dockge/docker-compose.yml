services:
  dockge:
    image: docker.io/louislam/dockge:1.4.2
    container_name: dockge
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${PUID:-1000}:${PGID:-1000}"
    userns_mode: keep-id
    ports:
      - 5001:5001
    volumes:
      - ${PODMAN_SOCK}:/var/run/docker.sock:ro
      - ${DATA_DIR}/dockge:/app/data:z,U
      - ${STACKS_PATH}:${STACKS_PATH}:z,U
      - ./config/docker-podman-shim.sh:/usr/local/bin/docker:ro,z
    environment:
      - DOCKGE_STACKS_DIR=${STACKS_PATH}
      - DOMAIN=${DOMAIN}
      - DATA_DIR=${DATA_DIR}
      - PODMAN_SOCK=${PODMAN_SOCK}
      - STACKS_PATH=${STACKS_PATH}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    networks:
      - mgmt-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockge.rule=Host(`dockge.${DOMAIN}`)"
      - "traefik.http.routers.dockge.entrypoints=websecure"
      - "traefik.http.routers.dockge.tls=true"
      - "traefik.http.routers.dockge.middlewares=oauth2-proxy-admin@file,security-headers@file"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"
      - "traefik.docker.network=proxy-net"
      - "security.stig.compliance=true"
      - "security.stig.role=management"
      - "homepage.group=Management"
      - "homepage.name=Dockge"
      - "homepage.icon=dockge.png"
      - "homepage.description=Stack Management"
      - "homepage.href=https://dockge.${DOMAIN}"

networks:
  mgmt-net:
    external: true
  proxy-net:
    external: true
