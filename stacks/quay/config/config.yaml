DB_URI: postgresql://${QUAY_DB_USER}:${QUAY_DB_PASSWORD}@quay-db:5432/${QUAY_DB_NAME}
SERVER_HOSTNAME: quay.${DOMAIN}
SETUP_COMPLETE: true
SUPER_USERS:
  - quayadmin
FEATURE_ANONYMOUS_ACCESS: false
FEATURE_USER_INITIALIZE: true
FEATURE_USER_CREATION: true
REGISTRY_TITLE: Geo-Brain Quay
REGISTRY_TITLE_SHORT: Quay
AUTHENTICATION_TYPE: OIDC
OIDC_PROVIDER_CONFIG:
  - OIDC_SERVER_URL: "https://kanidm.${DOMAIN}/oauth2/openid/quay"
    CLIENT_ID: "quay"
    CLIENT_SECRET: "${QUAY_OIDC_SECRET}"
    OIDC_SCOPES:
      - openid
      - profile
      - email
    LOGIN_SCOPES:
      - openid
      - profile
      - email
SECRET_KEY: GeoBrainQuaySecretKey123
DATABASE_SECRET_KEY: GeoBrainQuayDBSecretKey123

# Storage Configuration
DISTRIBUTED_STORAGE_CONFIG:
  default:
    - LocalStorage
    - storage_path: /datastorage/registry
DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
  - default
DISTRIBUTED_STORAGE_PREFERENCE:
  - default

# Redis Configuration
BUILDLOGS_REDIS:
  host: quay-redis
  port: 6379
  password: ""
USER_EVENTS_REDIS:
  host: quay-redis
  port: 6379
  password: ""

# Clair v4 Integration
FEATURE_SECURITY_SCANNER: true
SECURITY_SCANNER_V4_ENDPOINT: http://clair:8080

# DISA STIG / Privacy
FEATURE_TELEMETRY_LOGGING: false
FEATURE_APP_SPECIFIC_TOKENS: true
