DB_URI: "postgresql://${QUAY_DB_USER}:${QUAY_DB_PASSWORD}@quay-db:5432/${QUAY_DB_NAME}"
SERVER_HOSTNAME: "quay.${DOMAIN}"
SETUP_COMPLETE: true
SUPER_USERS:
  - quayadmin
FEATURE_ANONYMOUS_ACCESS: false
FEATURE_PROXY_STORAGE: true
FEATURE_USER_INITIALIZE: true
FEATURE_USER_CREATION: true
REGISTRY_TITLE: "My-HomeLab Quay"
REGISTRY_TITLE_SHORT: "Quay"
AUTHENTICATION_TYPE: Database
FEATURE_OIDC_LOGIN: true
OIDC_LOGIN_CONFIG:
  CLIENT_ID: "quay"
  CLIENT_SECRET: "${QUAY_OIDC_SECRET}"
  # Trailing slash omitted: Quay appends /.well-known/openid-configuration and
  # compares the iss claim against this value — both require no trailing slash.
  OIDC_SERVER: "https://kanidm.${DOMAIN}/oauth2/openid/quay"
  SERVICE_NAME: "kanidm"
  LOGIN_SCOPES: ["openid", "profile", "email", "groups"]
SECRET_KEY: "${QUAY_SECRET_KEY}"
DATABASE_SECRET_KEY: "${QUAY_DB_SECRET_KEY}"
PREFERRED_URL_SCHEME: https
EXTERNAL_TLS_TERMINATION: true

# Storage Configuration
DISTRIBUTED_STORAGE_CONFIG:
  default:
    - LocalStorage
    - storage_path: /datastorage/registry
DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
  - default
DISTRIBUTED_STORAGE_PREFERENCE:
  - default

# Redis Configuration
BUILDLOGS_REDIS:
  host: "quay-redis"
  port: 6379
  password: ""
USER_EVENTS_REDIS:
  host: "quay-redis"
  port: 6379
  password: ""

# Clair v4 Integration
FEATURE_SECURITY_SCANNER: false
SECURITY_SCANNER_V4_ENDPOINT: "http://clair:8080"

# Pull-Through Proxy Cache (mirror docker.io, ghcr.io, quay.io)
FEATURE_PROXY_CACHE: false

# DISA STIG / Privacy
FEATURE_TELEMETRY_LOGGING: false
FEATURE_APP_SPECIFIC_TOKENS: true

# Kanidm OIDC SSO
FEATURE_DIRECT_LOGIN: true
