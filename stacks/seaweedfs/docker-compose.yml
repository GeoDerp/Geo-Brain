services:
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:3.84
    container_name: seaweedfs
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server -dir="/data" -s3 -ip.bind=0.0.0.0 -ip=seaweedfs
    environment:
      - WEED_MASTER_VOLUME_SIZE_LIMIT_MB=1024
      - WEED_S3_CONFIG=/etc/seaweedfs/s3.json
    volumes:
      - ${DATA_DIR}/seaweedfs:/data:Z,U
      - ${STACKS_PATH}/traefik/config/certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro,z
    ports:
      - 9333:9333 # Master server
      - 8888:8888 # Filer
      - 8333:8333 # S3 Gateway
    networks:
      - storage-net
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9333/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      - "traefik.enable=true"
      # Filer UI route: storage.DOMAIN → port 8888
      - "traefik.http.routers.storage-ui.rule=Host(`storage.${DOMAIN}`)"
      - "traefik.http.routers.storage-ui.entrypoints=websecure"
      - "traefik.http.routers.storage-ui.tls=true"
      - "traefik.http.routers.storage-ui.tls.certresolver=stepca"
      - "traefik.http.routers.storage-ui.middlewares=security-headers@file,oauth2-proxy-admin@file"
      - "traefik.http.services.storage-ui.loadbalancer.server.port=8888"
      # S3 API route: s3.DOMAIN → port 8333 (S3 API)
      - "traefik.http.routers.s3-api.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.routers.s3-api.entrypoints=websecure"
      - "traefik.http.routers.s3-api.tls=true"
      - "traefik.http.routers.s3-api.tls.certresolver=stepca"
      - "traefik.http.routers.s3-api.middlewares=security-headers@file"
      - "traefik.http.services.s3-api.loadbalancer.server.port=8333"
      - "traefik.docker.network=proxy-net"
      - "security.stig.compliance=true"
      - "security.stig.role=storage"
      - "homepage.group=Infrastructure"
      - "homepage.name=SeaweedFS"
      - "homepage.icon=seaweedfs.png"
      - "homepage.description=Distributed S3-Compatible Storage"
      - "homepage.href=https://storage.${DOMAIN}"

networks:
  storage-net:
    external: true
  proxy-net:
    external: true
